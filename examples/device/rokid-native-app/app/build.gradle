plugins { id "com.android.application" }

android {
    namespace "dev.galatea.rokid.nativeexample"
    compileSdk 35
    defaultConfig {
        applicationId "dev.galatea.rokid.nativeexample"
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(":rokid-native-sdk") }
